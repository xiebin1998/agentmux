[package]
name = "sigcheck"
version = "0.0.0"
edition = "2021"
# 不是应用的一部分：只给 CI / 本地做「安装包与签名是否对得上」的自检。
# 用 minisign-verify 与应用运行时**同一套库**，避免自己造一套校验逻辑。
publish = false

[dependencies]
minisign-verify = "0.2.5"
# 只用来在发布时给最终产物重签：CI 里没有 `cargo tauri` 子命令（tauri-action 用的是它自己的 CLI），
# 所以签名这一步不能依赖外部 CLI。用的就是 tauri-cli 自己那套库。
minisign = "0.7.3"
base64 = "0.22"
serde_json = "1"